name: Apply_SQL_to_dev_DB

# Esegue a mano uno script della cartella sql/ sul DB di SVILUPPO (es.
# l'allineamento dello schema a prod) e poi ricopia i dati da prod.
# Riceve solo il secret di dev per lo script SQL: prod non viene mai modificato.

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: "Script da eseguire su dev (path nella cartella sql/)"
        required: true
        default: "sql/align_dev_schema_2026-09-23.sql"
      run_sync:
        description: "Dopo lo script, ricopia i dati da prod (sync_dev_db.py)"
        type: boolean
        default: true

jobs:
  apply-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check SQL file
        env:
          SQL_FILE: ${{ inputs.sql_file }}
        run: |
          case "$SQL_FILE" in
            sql/*.sql) ;;
            *) echo "Il file deve stare in sql/ e finire in .sql: $SQL_FILE"; exit 1 ;;
          esac
          test -f "$SQL_FILE" || { echo "File non trovato: $SQL_FILE"; exit 1; }

      - name: Apply SQL to dev
        env:
          SUPABASE_PASSWORD_DEV: ${{ secrets.SUPABASE_PASSWORD_DEV }}
          SQL_FILE: ${{ inputs.sql_file }}
        run: psql "$SUPABASE_PASSWORD_DEV" -v ON_ERROR_STOP=1 -f "$SQL_FILE"

  sync-database:
    needs: apply-sql
    if: ${{ inputs.run_sync }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Run sync script
        env:
          SUPABASE_PASSWORD_PROD: ${{ secrets.SUPABASE_PASSWORD_PROD }}
          SUPABASE_PASSWORD_DEV: ${{ secrets.SUPABASE_PASSWORD_DEV }}
        run: python sync_dev_db.py
