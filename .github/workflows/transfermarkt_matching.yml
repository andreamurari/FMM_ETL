name: transfermarkt_matching

on:
  workflow_dispatch: # Lancio manuale finché transfermarkt_matching_schema.sql non è stato eseguito su prod
  # schedule:
  #   - cron: '0 3 * * *' # De-commenta per farlo girare una volta al giorno, 03:00 UTC

concurrency:
  group: transfermarkt_matching
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary
          pip install -r requirements-transfermarkt.txt

      - name: Calcola la stagione Transfermarkt corrente
        id: stagione
        run: |
          MESE=$(date -u +%-m)
          ANNO=$(date -u +%Y)
          if [ "$MESE" -ge 7 ]; then
            STAGIONE=$ANNO
          else
            STAGIONE=$((ANNO - 1))
          fi
          echo "valore=$STAGIONE" >> "$GITHUB_OUTPUT"

      - name: Scarica la rosa Serie A da Transfermarkt
        run: |
          python -m tfmkt confederations > confederations.json
          echo "confederations: $(wc -l < confederations.json) righe"
          python -m tfmkt competitions -p confederations.json > competitions.json
          echo "competitions: $(wc -l < competitions.json) righe"
          grep '"competition_type": "first_tier"' competitions.json \
            | grep '"country_code": "IT1"' > serie_a.json
          echo "serie_a: $(wc -l < serie_a.json) righe"
          cat serie_a.json
          python -m tfmkt clubs -p serie_a.json -s ${{ steps.stagione.outputs.valore }} > clubs.json
          echo "clubs: $(wc -l < clubs.json) righe"
          cat clubs.json

          # Sanity check: la Serie A ha sempre esattamente 20 club. Se lo scraping
          # è fallito/incompleto, meglio fermarsi qui che passare dati a metà al
          # job successivo (che ha comunque le sue guardie interne, ma questa
          # fa fallire il workflow in modo più immediato e leggibile nei log).
          N_CLUB=$(wc -l < clubs.json)
          if [ "$N_CLUB" -ne 20 ]; then
            echo "::error::Attesi 20 club, trovati $N_CLUB. Interrompo senza scaricare i giocatori."
            exit 1
          fi

          python -m tfmkt players -p clubs.json -s ${{ steps.stagione.outputs.valore }} > players.json

      - name: Esegui il matching e aggiorna il DB
        run: python transfermarkt_matching_job.py --input players.json
        env:
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}

      - name: Upload dump scaricato (debug, conservato 3 giorni)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transfermarkt-players-dump
          path: players.json
          retention-days: 3
          if-no-files-found: ignore
